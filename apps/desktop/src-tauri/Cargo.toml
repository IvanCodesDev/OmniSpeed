[package]
name = "omnispeed"
version = "0.1.0"
description = "OmniSpeed —— 全局倍速播放遥控器"
authors = ["OmniSpeed contributors"]
edition = "2021"

[lib]
name = "omnispeed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
# M4（开发文档 §7.7）：单实例、开机自启、自动更新
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "net", "io-util", "sync"] }
# 进程枚举：应用页「运行中」检测 + NM 中继的父进程（浏览器）探测（开发文档 §4.4）
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Native Messaging 宿主注册（HKCU，无需管理员）
winreg = "0.55"
# 项目内可复用库（开发文档 §10）：unsafe Win32 封装 / 播放器控制通道
platform-win = { path = "../../../crates/platform-win" }
player-ipc = { path = "../../../crates/player-ipc" }
