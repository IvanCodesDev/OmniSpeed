[package]
name = "omnispeed"
version = "0.1.0"
description = "OmniSpeed —— 全局倍速播放遥控器"
authors = ["OmniSpeed contributors"]
edition = "2021"

[lib]
name = "omnispeed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
